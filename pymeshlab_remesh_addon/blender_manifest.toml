schema_version = "2.0.0"
id = "pymeshlab_remesh"
version = "1.0.0"
name = "PyMeshLab Remeshing"
tagline = "Remeshing and surface reconstruction via PyMeshLab"
maintainer = "Nikolas Claussen <nc1333@princeton.edu>"
type = "add-on"
blender_version_min = "4.2.0"
license = ["SPDX:GPL-3.0-or-later",]

platforms = ["windows-x64", "macos-arm64", "linux-x64"]

# pymeshlab wheels — download with download_wheels.sh before building.
# Blender 4.2+ ships numpy, so no numpy wheel needed.
wheels = [
"./wheels/pymeshlab-2023.12.post2-cp311-cp311-macosx_11_0_arm64.whl",
"./wheels/pymeshlab-2023.12.post2-cp311-cp311-manylinux_2_31_x86_64.whl",
"./wheels/pymeshlab-2023.12.post2-cp311-cp311-win_amd64.whl",
]

paths_exclude_pattern = [
  "__pycache__/",
  ".DS_Store",
  "download_wheels.sh",
  "DEVELOPER_README.md",
]
