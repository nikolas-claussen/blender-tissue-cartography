schema_version = "2.0.0"
id = "blender_tissue_cartography"
version = "2.1.1"
name = "Blender Tissue Cartography"
tagline = "A tools for analysis of 4D imaging data in Blender"
maintainer = "Nikolas Claussen <nc1333@princeton.edu>"
type = "add-on"
# Blender 5.2 LTS only (ships Python 3.13, matching the cp313 wheels below).
blender_version_min = "5.2.0"
license = ["SPDX:GPL-3.0-or-later",]

# You can specify what platforms this can be used with.
platforms = ["windows-x64", "macos-arm64", "linux-x64"]

# Folder to store the wheels in the addon.
# numpy is bundled with Blender and intentionally excluded.
wheels = [
"./wheels/imageio-2.37.0-py3-none-any.whl",
"./wheels/lazy_loader-0.4-py3-none-any.whl",
"./wheels/networkx-3.4.2-py3-none-any.whl",
"./wheels/packaging-24.2-py3-none-any.whl",
"./wheels/pillow-11.1.0-cp313-cp313-macosx_11_0_arm64.whl",
"./wheels/pillow-11.1.0-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.whl",
"./wheels/pillow-11.1.0-cp313-cp313-win_amd64.whl",
"./wheels/scikit_image-0.25.1-cp313-cp313-macosx_12_0_arm64.whl",
"./wheels/scikit_image-0.25.1-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.whl",
"./wheels/scikit_image-0.25.1-cp313-cp313-win_amd64.whl",
"./wheels/scipy-1.15.1-cp313-cp313-macosx_12_0_arm64.whl",
"./wheels/scipy-1.15.1-cp313-cp313-manylinux_2_17_x86_64.manylinux2014_x86_64.whl",
"./wheels/scipy-1.15.1-cp313-cp313-win_amd64.whl",
"./wheels/tifffile-2025.1.10-py3-none-any.whl",]

#[build]
# Some optional extra options were added to this table

# Folder containing the source code of the extension. Defaults to the current directory
#source = 'src'
# Folder for where the extension will be stored
# with all the files (to build the extension). Defaults to ./build
#build = 'build'
# Output folder for the built addon in the .zip file.
#dist = 'dist'

# This contains a list of files or folders to keep in the built extension.
#paths = [
#  'LICENSE',
#  'README.md',
#]

# exclude test data from build
# NOTE: paths_exclude_pattern is only honored inside the [build] table.
[build]
paths_exclude_pattern = [
  "test_data/",
  "__pycache__/",
  ".*",
  "/*.zip",
  "reload_script.py",
  "new_feature_notes",
  "DEVELOPER_README.md",
]